[project]
name = "notion-search"
version = "0.1.0"
description = "Local semantic search over a Notion workspace, wired as a Claude agent tool"
authors = [
    { name = "ddudi", email = "ddudios@naver.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.2.0",
    "fastapi>=0.141.1",
    "notion-client>=3.1.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.52.4",
]
